        let quizData = [];
        let submitted = false;
        
        // Timer Variables
        let timerInterval;
        let elapsedSeconds = 0;

        // Parse the raw string into a usable JS array of objects
        function parseQuizData() {
            const lines = rawQuizData.split('\n').filter(line => line.trim() !== '');
            lines.forEach(line => {
                const parts = line.split('|');
                const questionText = parts[0];
                const options = [];
                
                for(let i = 1; i < parts.length; i++) {
                    let optText = parts[i].trim();
                    let isCorrect = false;
                    
                    // Logic to extract ✅ but not show it to the user
                    if(optText.includes('✅')) {
                        isCorrect = true;
                        optText = optText.replace('✅', '').trim();
                    }
                    
                    options.push({ text: optText, isCorrect: isCorrect });
                }
                
                quizData.push({ q: questionText, options: options });
            });
        }

        // Render HTML for all questions
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            
            quizData.forEach((question, qIndex) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-5 md:p-8 hover:shadow-md transition-shadow";
                card.id = `card-${qIndex}`;
                
                const qTitle = document.createElement('h3');
                qTitle.className = "text-lg md:text-xl font-bold text-slate-800 mb-4";
                qTitle.innerText = question.q;
                card.appendChild(qTitle);
                
                const optionsGrid = document.createElement('div');
                optionsGrid.className = "grid grid-cols-1 md:grid-cols-2 gap-3";
                
                question.options.forEach((opt, oIndex) => {
                    const label = document.createElement('label');
                    label.className = "option-label flex items-center p-3 md:p-4 border rounded-lg cursor-pointer hover:bg-indigo-50 border-slate-200 select-none group";
                    label.id = `label-${qIndex}-${oIndex}`;
                    
                    const input = document.createElement('input');
                    input.type = "radio";
                    input.name = `question_${qIndex}`;
                    input.value = oIndex;
                    input.className = "w-5 h-5 text-indigo-600 bg-slate-100 border-slate-300 focus:ring-indigo-500 mr-3 cursor-pointer";
                    
                    input.addEventListener('change', () => handleSelection(qIndex));
                    
                    const span = document.createElement('span');
                    span.className = "text-slate-700 font-medium group-hover:text-indigo-800 transition-colors";
                    span.innerText = opt.text;
                    
                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                });
                
                card.appendChild(optionsGrid);
                container.appendChild(card);
            });
        }

        // Handle visual feedback during selection and update progress
        function handleSelection(qIndex) {
            if (submitted) return;
            
            // Remove highlight from all options in this question
            const labels = document.querySelectorAll(`[id^="label-${qIndex}-"]`);
            labels.forEach(l => {
                l.classList.remove('bg-indigo-100', 'border-indigo-400');
            });
            
            // Highlight newly selected option
            const checkedInput = document.querySelector(`input[name="question_${qIndex}"]:checked`);
            if (checkedInput) {
                const selectedLabel = document.getElementById(`label-${qIndex}-${checkedInput.value}`);
                selectedLabel.classList.add('bg-indigo-100', 'border-indigo-400');
            }
            
            updateProgress();
        }

        // Update progress bar and text
        function updateProgress() {
            const total = quizData.length;
            // Count unique questions answered
            const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            
            const progressPercent = (answered / total) * 100;
            
            document.getElementById('progress-text').innerText = `${bengaliNum(answered)} / ${bengaliNum(total)} উত্তর দেওয়া হয়েছে`;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }
        
        // Helper to convert English digits to Bengali for aesthetic
        function bengaliNum(num) {
            const finalEnEnglishToBanglaNumber = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
            return String(num).replace(/[0-9]/g, function(x) {
                return finalEnEnglishToBanglaNumber[x];
            });
        }

        // Timer Logic
        function startTimer() {
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const hrs = Math.floor(elapsedSeconds / 3600);
            const mins = Math.floor((elapsedSeconds % 3600) / 60);
            const secs = elapsedSeconds % 60;
            
            const formatted = 
                String(hrs).padStart(2, '0') + ':' + 
                String(mins).padStart(2, '0') + ':' + 
                String(secs).padStart(2, '0');
                
            document.getElementById('timer-display').innerText = formatted;
        }

        // Submit and evaluate exam
        function submitExam() {
            if(submitted) return; 
            
            // Confirm if not all answered
            const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            const total = quizData.length;
            
            if (answered < total) {
                const conf = confirm(`আপনি ১৩০টির মধ্যে ${answered} টি প্রশ্নের উত্তর দিয়েছেন। আপনি কি নিশ্চিত যে সাবমিট করতে চান?`);
                if (!conf) return;
            }
            
            // Stop timer
            clearInterval(timerInterval);
            document.getElementById('timer-container').classList.replace('bg-rose-600', 'bg-slate-700');
            document.getElementById('timer-container').classList.replace('border-rose-500', 'border-slate-600');
            
            let score = 0;
            
            quizData.forEach((question, qIndex) => {
                const selectedInput = document.querySelector(`input[name="question_${qIndex}"]:checked`);
                const card = document.getElementById(`card-${qIndex}`);
                let answeredCorrectly = false;
                
                question.options.forEach((opt, oIndex) => {
                    const label = document.getElementById(`label-${qIndex}-${oIndex}`);
                    const input = document.querySelector(`input[name="question_${qIndex}"][value="${oIndex}"]`);
                    
                    // Freeze inputs
                    input.disabled = true;
                    label.classList.remove('cursor-pointer', 'hover:bg-indigo-50', 'bg-indigo-100', 'border-indigo-400');
                    label.classList.add('cursor-default');
                    
                    if (opt.isCorrect) {
                        // Mark correct answer Green
                        label.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                        label.querySelector('span').innerHTML += ' <span class="text-emerald-600 font-extrabold ml-1">✓</span>';
                        
                        if (selectedInput && selectedInput.value == oIndex) {
                            answeredCorrectly = true;
                        }
                    } else if (selectedInput && selectedInput.value == oIndex) {
                        // Mark wrong selection Red
                        label.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                        label.querySelector('span').innerHTML += ' <span class="text-rose-600 font-extrabold ml-1">✗</span>';
                    } else {
                        // Fade out unselected incorrect options
                        label.classList.add('opacity-50', 'bg-slate-50');
                    }
                });
                
                // Color entire card slightly based on correctness
                if (answeredCorrectly) {
                    score++;
                    card.classList.add('border-emerald-300', 'bg-emerald-50/20');
                } else if (selectedInput) {
                    card.classList.add('border-rose-300', 'bg-rose-50/20');
                } else {
                    card.classList.add('border-amber-300', 'bg-amber-50/20'); // Unanswered
                }
            });
            
            // Show scores
            const scoreText = `আপনার স্কোর: ${score} / ${total}`;
            
            const topDisplay = document.getElementById('score-display-top');
            topDisplay.innerText = scoreText;
            topDisplay.classList.remove('hidden');
            
            const bottomDisplay = document.getElementById('score-display-bottom');
            bottomDisplay.innerText = scoreText;
            bottomDisplay.classList.remove('hidden');
            
            // Update Submit Button State
            const btn = document.getElementById('submit-btn');
            btn.innerText = "পরীক্ষা সম্পন্ন হয়েছে";
            btn.disabled = true;
            btn.classList.remove('hover:bg-indigo-700', 'hover:-translate-y-1', 'shadow-lg', 'bg-indigo-600');
            btn.classList.add('bg-slate-500', 'cursor-not-allowed', 'opacity-80');
            
            submitted = true;
            
            // Scroll smoothly to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize Application
        window.onload = () => {
            parseQuizData();
            renderQuestions();
            updateProgress();
            startTimer();
        };
    </script>
</body>
</html>
